model:
  name: gemma-4-12b-it
  path: google/gemma-4-12B-it
  chat_template: hf
model_loading:
  quantization: 8bit
  dtype: bfloat16
  device_map: auto
data:
  jailbreak_model_name: llama-3
  harmful_calibration: data/harmful_calibration.csv
  harmless_calibration: data/harmless_calibration.csv
  harmful_test: data/harmful_test.csv
  harmless_test: data/harmless_test.csv
runtime:
  output_dir: result
  seed: 0
audit:
  enabled: true
  run_id: gemma-4-12b-it-phase1
detection:
  update_vectors: false
  jailbreaks: [ijp, gcg, saa, autodan, pair, drattack, puzzler, zulu, base64]
cache:
  hidden_states: false   # set true to persist per-prompt hidden states under `dir`
  dir: representations
  last_k: 5
phase2:
  enabled: false
  output_dir: outputs/phase2
  strict_spans: false
