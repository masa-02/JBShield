[project]
name = "jbshield-repro"
version = "0.1.0"
description = "JBShield-D reproduction utilities for Sec4AI experiments"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.14.0",
  "bitsandbytes==0.49.2",
  "fschat",
  "nltk",
  "numpy",
  "pandas",
  "protobuf",
  "pyarrow",
  "pyyaml",
  "safetensors",
  "sentencepiece",
  "scikit-learn",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm",
  "transformers==5.12.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu121", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true